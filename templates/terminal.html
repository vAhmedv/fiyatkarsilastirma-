<!DOCTYPE html>
<html lang="tr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiyat Takip | Canlı Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bg: '#0f172a', surface: '#1e293b', border: '#334155',
                        primary: '#6366f1', success: '#10b981', danger: '#ef4444', warning: '#f59e0b'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .terminal-scroll::-webkit-scrollbar {
            width: 8px;
        }

        .terminal-scroll::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 9999px;
        }
    </style>
</head>

<body class="bg-bg text-slate-200 min-h-screen">
    <main class="max-w-5xl mx-auto px-4 py-8">
        <header class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between mb-6">
            <div>
                <p class="text-xs uppercase tracking-[0.3em] text-slate-500">Fiyat Takip</p>
                <h1 class="text-2xl sm:text-3xl font-semibold text-white">Canlı Log Akışı</h1>
                <p class="text-sm text-slate-400 mt-1">Sunucu loglarını anlık olarak izleyin.</p>
            </div>
            <div class="flex flex-wrap items-center gap-3">
                <a href="/"
                    class="text-xs px-3 py-1 rounded-full border border-border text-slate-300 hover:border-primary hover:text-white transition">
                    Kontrol Paneli
                </a>
                <span id="statusDot" class="h-2.5 w-2.5 rounded-full bg-warning"></span>
                <span id="statusText" class="text-sm text-slate-400">Bağlanıyor...</span>
            </div>
        </header>

        <section class="bg-surface border border-border rounded-xl shadow-lg overflow-hidden">
            <div class="flex items-center justify-between px-4 py-3 border-b border-border">
                <p class="text-sm text-slate-400">Stream-logs SSE</p>
                <div class="flex items-center gap-2">
                    <button id="pauseBtn"
                        class="text-xs px-3 py-1 rounded-full border border-border hover:border-primary hover:text-white transition">
                        Duraklat
                    </button>
                    <button id="clearBtn"
                        class="text-xs px-3 py-1 rounded-full border border-border hover:border-danger hover:text-white transition">
                        Temizle
                    </button>
                </div>
            </div>
            <div id="logContainer" aria-live="polite"
                class="terminal-scroll font-mono text-xs sm:text-sm leading-relaxed h-[65vh] overflow-y-auto px-4 py-3 space-y-1">
                <p class="text-slate-500">Loglar bekleniyor...</p>
            </div>
        </section>
    </main>

    <noscript>
        <p class="text-center text-sm text-slate-400 mt-6">Log akışı için JavaScript gereklidir.</p>
    </noscript>

    <script>
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const logContainer = document.getElementById('logContainer');
        const clearBtn = document.getElementById('clearBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        let isPaused = false;
        let eventSource;

        const setStatus = (state, message) => {
            statusText.textContent = message;
            statusDot.classList.remove('bg-success', 'bg-warning', 'bg-danger');
            statusDot.classList.add(state);
        };

        const appendLine = (text) => {
            const line = document.createElement('div');
            line.textContent = text;
            line.className = 'text-slate-200';
            logContainer.appendChild(line);
            if (logContainer.children.length > 500) {
                logContainer.removeChild(logContainer.firstElementChild);
            }
            logContainer.scrollTop = logContainer.scrollHeight;
        };

        const connect = () => {
            if (eventSource) {
                eventSource.close();
            }
            eventSource = new EventSource('/stream-logs');
            setStatus('bg-warning', 'Bağlanıyor...');

            eventSource.onopen = () => {
                setStatus('bg-success', 'Bağlı');
            };

            eventSource.onmessage = (event) => {
                if (isPaused) {
                    return;
                }
                if (logContainer.querySelector('p')) {
                    logContainer.innerHTML = '';
                }
                appendLine(event.data);
            };

            eventSource.onerror = () => {
                setStatus('bg-danger', 'Bağlantı koptu, yeniden deneniyor...');
            };
        };

        clearBtn.addEventListener('click', () => {
            logContainer.innerHTML = '<p class="text-slate-500">Loglar temizlendi.</p>';
        });

        pauseBtn.addEventListener('click', () => {
            isPaused = !isPaused;
            pauseBtn.textContent = isPaused ? 'Devam Et' : 'Duraklat';
            pauseBtn.classList.toggle('text-warning');
        });

        connect();
    </script>
</body>

</html>
